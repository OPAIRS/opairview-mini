<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OPAIRS Research Hub</title>
</head>
<body>
<script>
/**
 * OPAIRS Research Hub – Edge Gallery JS Skill
 * Saves, organizes, and searches research links in topic collections.
 * Data persisted via localStorage on-device.
 */

window.ai_edge_gallery_get_result = async function(data) {
  const STORAGE_KEY = 'opairs_hub_links';

  function loadLinks() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    } catch (e) {
      return [];
    }
  }

  function saveLinks(links) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(links));
  }

  let input;
  try {
    input = JSON.parse(data);
  } catch (e) {
    return 'Fehler: Ungültiges JSON – ' + e.message;
  }

  const action = (input.action || 'list').toLowerCase();

  // ─── SAVE ────────────────────────────────────────────────────────────────
  if (action === 'save') {
    if (!input.url) return 'Fehler: URL fehlt.';

    const links = loadLinks();
    const link = {
      id: Date.now().toString(),
      url: input.url.trim(),
      title: (input.title || input.url).trim(),
      collection: (input.collection || 'Allgemein').trim(),
      notes: (input.notes || '').trim(),
      savedAt: new Date().toISOString()
    };
    links.push(link);
    saveLinks(links);

    return (
      '✓ Gespeichert in "' + link.collection + '"\n' +
      'Titel: ' + link.title + '\n' +
      'URL: ' + link.url +
      (link.notes ? '\nNotiz: ' + link.notes : '') +
      '\nID: ' + link.id
    );
  }

  // ─── SEARCH ──────────────────────────────────────────────────────────────
  if (action === 'search') {
    const q = (input.query || '').toLowerCase().trim();
    if (!q) return 'Fehler: Suchbegriff fehlt.';

    const links = loadLinks();
    const results = links.filter(l =>
      l.title.toLowerCase().includes(q) ||
      l.url.toLowerCase().includes(q) ||
      l.collection.toLowerCase().includes(q) ||
      l.notes.toLowerCase().includes(q)
    );

    if (results.length === 0) {
      return 'Keine Ergebnisse für "' + input.query + '".';
    }

    return (
      results.length + ' Ergebnis(se) für "' + input.query + '":\n\n' +
      results.map(function(l) {
        return (
          '[' + l.collection + '] ' + l.title + '\n' +
          l.url +
          (l.notes ? '\n→ ' + l.notes : '') +
          '\nID: ' + l.id
        );
      }).join('\n\n')
    );
  }

  // ─── LIST ─────────────────────────────────────────────────────────────────
  if (action === 'list') {
    const links = loadLinks();

    if (links.length === 0) {
      return 'Noch keine Links gespeichert. Sag mir eine URL und ich speichere sie.';
    }

    // List specific collection
    if (input.collection) {
      const col = input.collection.trim();
      const filtered = links.filter(function(l) {
        return l.collection.toLowerCase() === col.toLowerCase();
      });

      if (filtered.length === 0) {
        return 'Keine Links in Collection "' + col + '".';
      }

      return (
        '📁 ' + col + ' (' + filtered.length + ' Links)\n\n' +
        filtered.map(function(l) {
          return (
            '• ' + l.title + '\n' +
            '  ' + l.url +
            (l.notes ? '\n  → ' + l.notes : '') +
            '\n  ID: ' + l.id
          );
        }).join('\n\n')
      );
    }

    // List all collections with counts
    const collections = {};
    links.forEach(function(l) {
      collections[l.collection] = (collections[l.collection] || 0) + 1;
    });

    const sorted = Object.entries(collections).sort(function(a, b) {
      return b[1] - a[1];
    });

    return (
      links.length + ' Links in ' + sorted.length + ' Collections:\n\n' +
      sorted.map(function(entry) {
        return '📁 ' + entry[0] + ' (' + entry[1] + ')';
      }).join('\n')
    );
  }

  // ─── DELETE ───────────────────────────────────────────────────────────────
  if (action === 'delete') {
    if (!input.id) return 'Fehler: ID fehlt. Bitte zuerst suchen oder listen um die ID zu ermitteln.';

    const links = loadLinks();
    const idx = links.findIndex(function(l) { return l.id === input.id; });

    if (idx === -1) {
      return 'Link mit ID ' + input.id + ' nicht gefunden.';
    }

    const removed = links.splice(idx, 1)[0];
    saveLinks(links);

    return '✓ Gelöscht: "' + removed.title + '" aus Collection "' + removed.collection + '"';
  }

  // ─── CLEAR COLLECTION ─────────────────────────────────────────────────────
  if (action === 'clear_collection') {
    if (!input.collection) return 'Fehler: Collection-Name fehlt.';

    const links = loadLinks();
    const col = input.collection.trim();
    const remaining = links.filter(function(l) {
      return l.collection.toLowerCase() !== col.toLowerCase();
    });
    const deleted = links.length - remaining.length;

    if (deleted === 0) {
      return 'Keine Links in Collection "' + col + '" gefunden.';
    }

    saveLinks(remaining);
    return '✓ ' + deleted + ' Link(s) aus "' + col + '" gelöscht.';
  }

  return 'Unbekannte Aktion: "' + action + '". Gültige Aktionen: save, search, list, delete, clear_collection.';
};
</script>
</body>
</html>
